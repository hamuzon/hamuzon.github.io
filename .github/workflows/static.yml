
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Run on pushes targeting the default branch
  push:
    branches: ["main"]
    paths-ignore:
      - 'sitemap.xml'
      - 'public/**'

  # Also run when the sitemap update workflow completes
  workflow_run:
    workflows: ["Update Sitemap"]
    types:
      - completed

  # Allow manual execution from the Actions tab
  workflow_dispatch:

# Set permissions for the GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment and do not cancel in-progress deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single job for deploying the site
  deploy:
    # Run on pushes or when the Update Sitemap workflow succeeds
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject FQDN normalization script
        shell: bash
        run: |
          # Inject the hostname normalization script after the opening head tag in all HTML files
          find . -type f -name "*.html" ! -name "google*.html" -print0 |
          while IFS= read -r -d '' file; do
            if grep -q 'hostname.endsWith' "$file"; then
              echo "FQDN normalization script already exists: $file"
              continue
            fi

            sed -i '/<head>/a\
          <script>(()=>{const u=new URL(location.href);if(u.hostname.endsWith(".")){u.hostname=u.hostname.slice(0,-1);location.replace(u.toString());}})();</script>' "$file"

            echo "Updated: $file"
          done

      - name: Inject Google Analytics
        shell: bash
        run: |
          # Inject Google Analytics after the opening head tag in all HTML files
          find . -type f -name "*.html" ! -name "google*.html" -print0 |
          while IFS= read -r -d '' file; do
            if grep -q 'G-F8HVYVW05H' "$file"; then
              echo "Google Analytics already exists: $file"
              continue
            fi

            sed -i '/<head>/a\
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-F8HVYVW05H"></script>\
          <script>\
          window.dataLayer = window.dataLayer || [];\
          function gtag(){dataLayer.push(arguments);}\
          gtag("js", new Date());\
          gtag("config", "G-F8HVYVW05H");\
          </script>' "$file"

            echo "Updated: $file"
          done

      - name: Remove sensitive files from deployment artifact
        shell: bash
        run: |
          # Remove files and directories from the deployment artifact
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
