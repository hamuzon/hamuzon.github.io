<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website List | My Websites, Tools & Services</title>
  <meta name="description" content="homepageのリンク一覧ページです。A homepage link list page." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Website List | My Websites, Tools &amp; Services" />
  <meta property="og:description" content="homepageのリンク一覧ページです。A homepage link list page." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Website List | My Websites, Tools &amp; Services" />
  <meta name="twitter:description" content="homepageのリンク一覧ページです。A homepage link list page." />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --md-primary: #386A20;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #B7F397;
      --md-on-primary-container: #042100;

      --md-secondary: #55624C;
      --md-on-secondary: #FFFFFF;
      --md-secondary-container: #D9E7CB;
      --md-on-secondary-container: #131E0D;

      --md-tertiary: #3B653D;
      --md-on-tertiary: #FFFFFF;
      --md-tertiary-container: #BDEDA0;
      --md-on-tertiary-container: #002204;

      --md-surface: #F7FBF1;
      --md-surface-variant: #E1E4D5;
      --md-surface-container: #F1F5EB;
      --md-surface-container-high: #EBEFE5;
      --md-surface-container-highest: #E5E9DF;
      --md-on-surface: #191E17;
      --md-on-surface-variant: #44483E;
      --md-outline: #74796D;
      --md-outline-variant: #C4C8BA;

      --md-background: #F7FBF1;
      --md-shadow: rgba(25, 30, 23, 0.12);

      --md-shape-xs: 8px;
      --md-shape-sm: 12px;
      --md-shape-md: 16px;
      --md-shape-lg: 28px;
      --md-shape-xl: 36px;
      --md-shape-full: 9999px;

      --md-motion-standard: cubic-bezier(0.2, 0, 0, 1);
      --md-motion-decelerate: cubic-bezier(0, 0, 0, 1);
      --md-motion-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --md-duration-short: 200ms;
      --md-duration-medium: 350ms;
      --md-duration-long: 500ms;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #9CD67D;
        --md-on-primary: #0F3900;
        --md-primary-container: #215109;
        --md-on-primary-container: #B7F397;

        --md-secondary: #BDCBB0;
        --md-on-secondary: #283421;
        --md-secondary-container: #3E4A36;
        --md-on-secondary-container: #D9E7CB;

        --md-tertiary: #A2D086;
        --md-on-tertiary: #10380D;
        --md-tertiary-container: #264F22;
        --md-on-tertiary-container: #BDEDA0;

        --md-surface: #11140E;
        --md-surface-variant: #44483E;
        --md-surface-container: #1D211A;
        --md-surface-container-high: #282B24;
        --md-surface-container-highest: #32362E;
        --md-on-surface: #E2E3DC;
        --md-on-surface-variant: #C4C8BA;
        --md-outline: #8E9285;
        --md-outline-variant: #44483E;

        --md-background: #11140E;
        --md-shadow: rgba(0, 0, 0, 0.35);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Google Sans', 'Noto Sans JP', 'Segoe UI', sans-serif;
      background-color: var(--md-background);
      color: var(--md-on-surface);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse 80% 60% at 10% 5%,
          color-mix(in srgb, var(--md-primary) 15%, transparent) 0%,
          transparent 100%),
        radial-gradient(ellipse 70% 50% at 90% 85%,
          color-mix(in srgb, var(--md-tertiary) 10%, transparent) 0%,
          transparent 100%),
        radial-gradient(ellipse 60% 70% at 50% 90%,
          color-mix(in srgb, var(--md-secondary) 10%, transparent) 0%,
          transparent 100%);
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 55vmax;
      height: 55vmax;
      border-radius: 50%;
      background: radial-gradient(circle,
          color-mix(in srgb, var(--md-primary-container) 45%, transparent) 0%,
          transparent 70%);
      animation: floatBlob1 20s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -15%;
      right: -10%;
      width: 50vmax;
      height: 50vmax;
      border-radius: 50%;
      background: radial-gradient(circle,
          color-mix(in srgb, var(--md-tertiary-container) 35%, transparent) 0%,
          transparent 70%);
      animation: floatBlob2 25s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatBlob1 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(6%, 5%) scale(1.08);
      }
    }

    @keyframes floatBlob2 {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(-5%, -6%) scale(1.06);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
    }

    h1 {
      text-align: center;
      font-family: 'Google Sans Display', 'Google Sans', sans-serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin-bottom: 2.5rem;
      color: var(--md-primary);
      background: linear-gradient(135deg,
          var(--md-primary) 0%,
          color-mix(in srgb, var(--md-primary) 70%, var(--md-tertiary)) 50%,
          var(--md-tertiary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShimmer 7s ease infinite alternate;
    }

    @keyframes titleShimmer {
      0% {
        filter: brightness(1);
      }

      100% {
        filter: brightness(1.12);
      }
    }

    h1 a.tpww {
      color: inherit;
      background: inherit;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      cursor: pointer;
    }

    h1 a.tpww:hover {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-color: var(--md-primary);
    }

    ul {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.25rem;
      padding: 0;
      margin: 0;
    }

    a {
      display: block;
      position: relative;
      overflow: hidden;
      padding: 1.35rem 1.3rem 1.35rem 1.55rem;
      border-radius: var(--md-shape-lg);
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.01em;
      box-shadow:
        0 1px 2px var(--md-shadow),
        0 2px 6px color-mix(in srgb, var(--md-shadow) 40%, transparent);
      border-left: 4px solid var(--md-primary);
      transition:
        transform var(--md-duration-medium) var(--md-motion-spring),
        box-shadow var(--md-duration-medium) var(--md-motion-standard),
        background var(--md-duration-short) var(--md-motion-standard),
        border-color var(--md-duration-short) var(--md-motion-standard);
      word-break: break-word;
      opacity: 0;
      animation: cardEnter var(--md-duration-long) var(--md-motion-decelerate) forwards;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    a::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: color-mix(in srgb, var(--md-primary) 0%, transparent);
      transition: background var(--md-duration-short) var(--md-motion-standard);
      pointer-events: none;
    }

    a:hover {
      transform: translateY(-5px) scale(1.015);
      border-left-color: var(--md-tertiary);
      background: var(--md-surface-container-high);
      box-shadow:
        0 4px 8px var(--md-shadow),
        0 8px 24px color-mix(in srgb, var(--md-primary) 18%, transparent);
    }

    a:hover::before {
      background: color-mix(in srgb, var(--md-primary) 8%, transparent);
    }

    a:active {
      transform: translateY(-2px) scale(0.99);
      transition-duration: 80ms;
    }

    li:nth-child(1) a {
      animation-delay: 0.05s;
    }

    li:nth-child(2) a {
      animation-delay: 0.10s;
    }

    li:nth-child(3) a {
      animation-delay: 0.15s;
    }

    li:nth-child(4) a {
      animation-delay: 0.20s;
    }

    li:nth-child(5) a {
      animation-delay: 0.25s;
    }

    li:nth-child(6) a {
      animation-delay: 0.30s;
    }

    li:nth-child(7) a {
      animation-delay: 0.35s;
    }

    li:nth-child(8) a {
      animation-delay: 0.40s;
    }

    li:nth-child(9) a {
      animation-delay: 0.45s;
    }

    li:nth-child(10) a {
      animation-delay: 0.50s;
    }

    li:nth-child(n+11) a {
      animation-delay: 0.55s;
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2.5rem 1rem 2rem;
      color: var(--md-on-surface-variant);
      font-size: 0.875rem;
      line-height: 1.9;
    }

    footer a {
      color: var(--md-primary);
      text-decoration: none;
      font-weight: 500;
      border-radius: var(--md-shape-xs);
      padding: 0 3px;
      transition: background var(--md-duration-short) var(--md-motion-standard);
    }

    footer a:hover {
      background: color-mix(in srgb, var(--md-primary) 12%, transparent);
      text-decoration: underline;
    }

    #public-site-list {
      display: none;
    }

    #footer-hamusata,
    #footer-hamuzon {
      display: none;
    }

    .footer-notice {
      display: block;
      padding: 0.75rem 1rem;
      border-radius: var(--md-shape-md);
      background: color-mix(in srgb, var(--md-primary-container) 40%, transparent);
      color: var(--md-on-primary-container);
      font-size: 0.85rem;
      max-width: 480px;
      margin: 0 auto;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.8rem;
      }

      ul {
        grid-template-columns: 1fr !important;
        gap: 0.9rem;
      }

      a {
        font-size: 0.95rem;
        padding: 1.1rem 1.1rem 1.1rem 1.3rem;
      }

      footer {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>
      <a href="/spring" class="tpww">Website List</a>
    </h1>
    <ul id="site-list"></ul>
    <ul id="public-site-list"></ul>
  </div>

  <footer id="main-footer">
    <span id="footer-hamusata">
      &copy; <span id="year-hamusata"></span>
      <a href="https://hamusata.f5.si" target="_blank" rel="noopener noreferrer">@hamusata</a>
    </span>
    <span id="footer-hamuzon">
      &copy; <span id="year-hamuzon"></span>
      <a href="https://github.com/hamuzon" target="_blank" rel="noopener noreferrer">@hamuzon</a>
    </span>
    <br><br>
    <span id="default-message">
      ※一部のサイトは現在アクセスできない場合があります。<br>
      Some sites may be temporarily unavailable.
    </span>
  </footer>

  <script src="sites.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const currentHost = window.location.hostname;
      const normalizedHost = currentHost.toLowerCase().replace(/\.$/, "");
      const siteList = document.getElementById("site-list");
      const publicSiteList = document.getElementById("public-site-list");
      const footerHamusata = document.getElementById("footer-hamusata");
      const footerHamuzon = document.getElementById("footer-hamuzon");
      const footer = document.getElementById("main-footer");

      function createLinkItem({ href, text, className, openInSameTab }) {
        const li = document.createElement("li");
        const a = document.createElement("a");

        if ((href === "https://home.hamusata.f5.si/" || href === "./") && text.includes("Website-List")) {
          a.href = "/";
        } else { a.href = href; }

        a.textContent = text;
        a.target = openInSameTab ? "_self" : "_blank";
        a.rel = "noopener noreferrer";
        if (className) a.className = className;

        li.appendChild(a);
        return li;
      }

      const isHomeHamusata = normalizedHost === "home.hamusata.f5.si";
      const isHamuzonGitHub = normalizedHost === "hamuzon.github.io" || normalizedHost.endsWith(".hamuzon.github.io");
      const isLinkSSubdomain = normalizedHost === "link-s.f5.si" || normalizedHost.endsWith(".link-s.f5.si");

      if (isHomeHamusata) {
        sitesData.homeHamusata.forEach(site => siteList.appendChild(createLinkItem(site)));
        siteList.style.display = "grid";
        publicSiteList.style.display = "none";
        footerHamusata.style.display = "inline";
        footerHamuzon.style.display = "none";

      } else if (isHamuzonGitHub) {
        sitesData.hamuzonGitHubIO.forEach(site => siteList.appendChild(createLinkItem(site)));
        siteList.style.display = "grid";
        publicSiteList.style.display = "none";
        footerHamusata.style.display = "none";
        footerHamuzon.style.display = "inline";

      } else if (isLinkSSubdomain) {
        sitesData.wwwLinkSF5Si.forEach(site => siteList.appendChild(createLinkItem(site)));
        siteList.style.display = "grid";
        publicSiteList.style.display = "none";
        footerHamusata.style.display = "inline";
        footerHamuzon.style.display = "none";

      } else {
        sitesData.publicSites.forEach(site => publicSiteList.appendChild(createLinkItem(site)));
        siteList.style.display = "none";
        publicSiteList.style.display = "grid";
        footer.innerHTML = `
          <span class="footer-notice">
            このサイトは公式ではなく、一部の情報は異なる場合があります。<br />
            This version may differ from the original official site.
          </span>
        `;
      }

      const baseYear = 2025;
      const currentYear = new Date().getFullYear();
      const yearDisplay = currentYear > baseYear ? `${baseYear}~${currentYear}` : `${baseYear}`;
      document.getElementById("year-hamusata").textContent = yearDisplay;
      document.getElementById("year-hamuzon").textContent = yearDisplay;
    });
  </script>
</body>

</html>
